name: Staging

# Every pull request into main is checked, built, and deployed to the staging Worker.
# Only one pull request may be open at a time; a second one fails the "One open PR" check.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: staging
  cancel-in-progress: true

jobs:
  single-pr:
    name: One open PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const open = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', base: 'main',
            });
            if (open.length > 1) {
              core.setFailed(
                `Only one pull request may be open at a time. Open now: ${open.map((pr) => `#${pr.number}`).join(', ')}. ` +
                'Consolidate them into one pull request and close the rest.'
              );
            }

  staging:
    name: Build and deploy to staging
    needs: single-pr
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Encoded images (public/media) are named by content hash and pruned when unused, so a cache
      # from any earlier build is safe and saves re-encoding every photo.
      - uses: actions/cache@v4
        with:
          path: public/media
          key: media-${{ hashFiles('scripts/build-media.mjs', 'scripts/build-share-images.mjs', 'assets-src/**') }}
          restore-keys: media-

      - run: npm run lint

      - run: npm run build

      - name: Deploy to staging
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -o pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::The CLOUDFLARE_API_TOKEN secret is not set, so staging cannot be deployed."
            exit 1
          fi
          npx wrangler deploy --env staging | tee deploy.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          if [ -z "$url" ]; then
            echo "::error::Deploy finished but no workers.dev URL was found in its output."
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Staging: $url" >> "$GITHUB_STEP_SUMMARY"

      # The /admin dashboard's password lives only in the ADMIN_PASSWORD repository secret.
      - name: Sync admin password
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          if [ -z "$ADMIN_PASSWORD" ]; then
            echo "::notice::ADMIN_PASSWORD is not set, so /admin stays locked. Add it under Settings > Secrets and variables > Actions."
            exit 0
          fi
          printf '%s' "$ADMIN_PASSWORD" | npx wrangler secret put ADMIN_PASSWORD --env staging

      # Scrapwrk checkout on staging uses a Stripe TEST key only (STRIPE_TEST_SECRET_KEY secret),
      # so trying the store here never charges a real card.
      - name: Sync Stripe test key
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          STRIPE_TEST_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
        run: |
          if [ -z "$STRIPE_TEST_SECRET_KEY" ]; then
            echo "::notice::STRIPE_TEST_SECRET_KEY is not set, so checkout on staging stays closed."
            exit 0
          fi
          case "$STRIPE_TEST_SECRET_KEY" in
            sk_test_*|rk_test_*) ;;
            *) echo "::error::STRIPE_TEST_SECRET_KEY must be a test key (sk_test_...)."; exit 1 ;;
          esac
          printf '%s' "$STRIPE_TEST_SECRET_KEY" | npx wrangler secret put STRIPE_SECRET_KEY --env staging

      # Public key for the Apple Pay / Google Pay buttons (STRIPE_TEST_PUBLISHABLE_KEY; not secret, but kept beside the others).
      - name: Sync Stripe publishable key
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_TEST_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$STRIPE_PUBLISHABLE_KEY" ]; then
            echo "::notice::STRIPE_TEST_PUBLISHABLE_KEY is not set, so there are no Apple Pay / Google Pay buttons (hosted checkout still works)."
            exit 0
          fi
          case "$STRIPE_PUBLISHABLE_KEY" in
            pk_test_*) ;;
            *) echo "::error::STRIPE_TEST_PUBLISHABLE_KEY must look like pk_test_...."; exit 1 ;;
          esac
          printf '%s' "$STRIPE_PUBLISHABLE_KEY" | npx wrangler secret put STRIPE_PUBLISHABLE_KEY --env staging

      # /shipped "Print my receipt". Set SHIPPED_GITHUB_TOKEN: anonymous GitHub lookups from Cloudflare are
      # rate-limited now and then. The rest are optional on staging: without ANTHROPIC_API_KEY receipts print as a demo
      # (no AI), and without Turnstile keys staging uses Cloudflare's always-pass test keys.
      # Sponsor lines use the built-in sandbox here (no real money), so no payment secrets are needed.
      - name: Sync /shipped secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SHIPPED_GITHUB_TOKEN: ${{ secrets.SHIPPED_GITHUB_TOKEN }}
          TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          STRIPE_TEST_SHIPPED_WEBHOOK_SECRET: ${{ secrets.STRIPE_TEST_SHIPPED_WEBHOOK_SECRET }}
        run: |
          sync() {
            if [ -z "$2" ]; then echo "::notice::$3 is not set, so $4."; return 0; fi
            printf '%s' "$2" | npx wrangler secret put "$1" --env staging
          }
          sync STRIPE_SHIPPED_WEBHOOK_SECRET "$STRIPE_TEST_SHIPPED_WEBHOOK_SECRET" STRIPE_TEST_SHIPPED_WEBHOOK_SECRET "refunds made in the Stripe dashboard don't remove /shipped lines (rejecting in /admin still refunds and removes them)"
          sync ANTHROPIC_API_KEY "$ANTHROPIC_API_KEY" ANTHROPIC_API_KEY "receipts print as a demo without the AI"
          sync GITHUB_TOKEN "$SHIPPED_GITHUB_TOKEN" SHIPPED_GITHUB_TOKEN "printing can fail with github-busy: anonymous GitHub lookups share Cloudflare's IPs and its 60-an-hour limit"
          sync TURNSTILE_SITE_KEY "$TURNSTILE_SITE_KEY" TURNSTILE_SITE_KEY "staging uses Turnstile test keys"
          sync TURNSTILE_SECRET_KEY "$TURNSTILE_SECRET_KEY" TURNSTILE_SECRET_KEY "staging uses Turnstile test keys"

      # Apple Pay needs the domain registered with Stripe (its verification file is public/.well-known).
      # Never fails the deploy: a wallet button that can't register simply doesn't show.
      - name: Register domain for Apple Pay
        env:
          STRIPE_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          [ -n "$STRIPE_KEY" ] || exit 0
          domain=$(printf '%s' "$DEPLOY_URL" | sed -E 's#^https?://##; s#/.*$##')
          curl -sS -u "$STRIPE_KEY:" https://api.stripe.com/v1/payment_method_domains -d "domain_name=$domain" | head -c 400 || true
          echo

      - name: Check every live song plays from staging
        env:
          CHECK_ORIGIN: ${{ steps.deploy.outputs.url }}
        run: npm run check:tracks

      - name: Comment staging link on the pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        env:
          STAGING_URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            const marker = '<!-- staging-deploy -->';
            const body = `${marker}\n**Staging is live:** ${process.env.STAGING_URL}\n\n` +
              `Built from \`${context.payload.pull_request.head.sha.slice(0, 7)}\`. ` +
              'Review it there; merging this pull request publishes it to https://brytonzoz.com.';
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
