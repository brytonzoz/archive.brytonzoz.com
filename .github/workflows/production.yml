name: Production

# Merging a pull request into main publishes it to https://brytonzoz.com.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  production:
    name: Build and deploy to brytonzoz.com
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Encoded images (public/media) are named by content hash and pruned when unused, so a cache
      # from any earlier build is safe and saves re-encoding every photo.
      - uses: actions/cache@v4
        with:
          path: public/media
          key: media-${{ hashFiles('scripts/build-media.mjs', 'scripts/build-share-images.mjs', 'assets-src/**') }}
          restore-keys: media-

      - run: npm run build

      # Staging and production read the same R2 bucket, so staging proves the songs are there
      # before production (whose /audio route may not exist yet) is deployed.
      - name: Check every live song exists in R2
        env:
          CHECK_ORIGIN: https://archive-staging.bryton-p-zoz.workers.dev
        run: npm run check:tracks

      - name: Check deploy credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::The CLOUDFLARE_API_TOKEN secret is not set, so production cannot be deployed."
            exit 1
          fi

      - name: Deploy site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --env=""

      # The /admin dashboard's password lives only in the ADMIN_PASSWORD repository secret.
      - name: Sync admin password
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          if [ -z "$ADMIN_PASSWORD" ]; then
            echo "::notice::ADMIN_PASSWORD is not set, so /admin stays locked. Add it under Settings > Secrets and variables > Actions."
            exit 0
          fi
          printf '%s' "$ADMIN_PASSWORD" | npx wrangler secret put ADMIN_PASSWORD --env=""

      # Scrapwrk checkout: the live Stripe secret key lives only in the STRIPE_SECRET_KEY repository
      # secret (STRIPE_WEBHOOK_SECRET is optional). Never put either in code or chat.
      - name: Sync Stripe keys
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
        run: |
          if [ -z "$STRIPE_SECRET_KEY" ]; then
            echo "::notice::STRIPE_SECRET_KEY is not set, so Scrapwrk checkout stays closed. Add it under Settings > Secrets and variables > Actions."
          else
            printf '%s' "$STRIPE_SECRET_KEY" | npx wrangler secret put STRIPE_SECRET_KEY --env=""
          fi
          if [ -n "$STRIPE_WEBHOOK_SECRET" ]; then
            printf '%s' "$STRIPE_WEBHOOK_SECRET" | npx wrangler secret put STRIPE_WEBHOOK_SECRET --env=""
          fi

      # Public key for the Apple Pay / Google Pay buttons (STRIPE_PUBLISHABLE_KEY; not secret, but kept beside the others).
      - name: Sync Stripe publishable key
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$STRIPE_PUBLISHABLE_KEY" ]; then
            echo "::notice::STRIPE_PUBLISHABLE_KEY is not set, so there are no Apple Pay / Google Pay buttons (hosted checkout still works)."
            exit 0
          fi
          case "$STRIPE_PUBLISHABLE_KEY" in
            pk_live_*) ;;
            *) echo "::error::STRIPE_PUBLISHABLE_KEY must look like pk_live_...."; exit 1 ;;
          esac
          printf '%s' "$STRIPE_PUBLISHABLE_KEY" | npx wrangler secret put STRIPE_PUBLISHABLE_KEY --env=""

      # Apple Pay needs the domain registered with Stripe (its verification file is public/.well-known).
      # Never fails the deploy: a wallet button that can't register simply doesn't show.
      - name: Register domain for Apple Pay
        env:
          STRIPE_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          DEPLOY_URL: https://brytonzoz.com
        run: |
          [ -n "$STRIPE_KEY" ] || exit 0
          domain=$(printf '%s' "$DEPLOY_URL" | sed -E 's#^https?://##; s#/.*$##')
          curl -sS -u "$STRIPE_KEY:" https://api.stripe.com/v1/payment_method_domains -d "domain_name=$domain" | head -c 400 || true
          echo

      # NonParallel tees: paid orders are sent to Printify with the PRINTIFY_ACCESS repository secret.
      - name: Sync Printify token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PRINTIFY_ACCESS: ${{ secrets.PRINTIFY_ACCESS }}
        run: |
          if [ -z "$PRINTIFY_ACCESS" ]; then
            echo "::notice::PRINTIFY_ACCESS is not set, so tee orders are not sent to Printify."
            exit 0
          fi
          printf '%s' "$PRINTIFY_ACCESS" | npx wrangler secret put PRINTIFY_ACCESS --env=""

      # Shipped: every secret its Worker needs, copied from the repository secrets in one `wrangler secret bulk`
      # (scripts/sync-worker-secrets.mjs maps the names, skips empty ones, prints names only, never values) and
      # the Turnstile widget created through the Cloudflare API when the token is allowed to.
      - name: Sync Shipped secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLAUDE_KEY: ${{ secrets.CLAUDE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_WORKSPACE: ${{ secrets.CLAUDE_WORKSPACE }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          TINYFISH: ${{ secrets.TINYFISH }}
          TINYFISH_API_KEY: ${{ secrets.TINYFISH_API_KEY }}
          SHIPPED_GITHUB_TOKEN: ${{ secrets.SHIPPED_GITHUB_TOKEN }}
          PRODUCTHUNT_KEY: ${{ secrets.PRODUCTHUNT_KEY }}
          PRODUCTHUNT_SECRET: ${{ secrets.PRODUCTHUNT_SECRET }}
          PRODUCTHUNT_TOKEN: ${{ secrets.PRODUCTHUNT_TOKEN }}
          BRANDFETCH_API: ${{ secrets.BRANDFETCH_API }}
          TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          STRIPE_SHIPPED_WEBHOOK_SECRET: ${{ secrets.STRIPE_SHIPPED_WEBHOOK_SECRET }}
        run: node scripts/sync-worker-secrets.mjs production

      - name: Deploy www/archive redirects
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --config workers/redirects/wrangler.jsonc

      - name: Smoke test
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' https://brytonzoz.com/)
          echo "brytonzoz.com returned $code"
          test "$code" = 200
          echo "### Live: https://brytonzoz.com" >> "$GITHUB_STEP_SUMMARY"
