name: Production

# Merging a pull request into main publishes it to https://brytonzoz.com.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  production:
    name: Build and deploy to brytonzoz.com
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      # Staging and production read the same R2 bucket, so staging proves the songs are there
      # before production (whose /audio route may not exist yet) is deployed.
      - name: Check every live song exists in R2
        env:
          CHECK_ORIGIN: https://archive-staging.bryton-p-zoz.workers.dev
        run: npm run check:tracks

      - name: Check deploy credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::The CLOUDFLARE_API_TOKEN secret is not set, so production cannot be deployed."
            exit 1
          fi

      - name: Deploy site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --env=""

      - name: Deploy www/archive redirects
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --config workers/redirects/wrangler.jsonc

      - name: Smoke test
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' https://brytonzoz.com/)
          echo "brytonzoz.com returned $code"
          test "$code" = 200
          echo "### Live: https://brytonzoz.com" >> "$GITHUB_STEP_SUMMARY"
