name: Staging

# Every pull request into main is checked, built, and deployed to the staging Worker.
# Only one pull request may be open at a time; a second one fails the "One open PR" check.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: staging
  cancel-in-progress: true

jobs:
  single-pr:
    name: One open PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const open = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', base: 'main',
            });
            if (open.length > 1) {
              core.setFailed(
                `Only one pull request may be open at a time. Open now: ${open.map((pr) => `#${pr.number}`).join(', ')}. ` +
                'Consolidate them into one pull request and close the rest.'
              );
            }

  staging:
    name: Build and deploy to staging
    needs: single-pr
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Encoded images (public/media) are named by content hash and pruned when unused, so a cache
      # from any earlier build is safe and saves re-encoding every photo.
      - uses: actions/cache@v4
        with:
          path: public/media
          key: media-${{ hashFiles('scripts/build-media.mjs', 'scripts/build-share-images.mjs', 'assets-src/**') }}
          restore-keys: media-

      - run: npm run lint

      - run: npm run build

      - name: Deploy to staging
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -o pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::The CLOUDFLARE_API_TOKEN secret is not set, so staging cannot be deployed."
            exit 1
          fi
          npx wrangler deploy --env staging | tee deploy.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          if [ -z "$url" ]; then
            echo "::error::Deploy finished but no workers.dev URL was found in its output."
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Staging: $url" >> "$GITHUB_STEP_SUMMARY"

      # The /admin dashboard's password lives only in the ADMIN_PASSWORD repository secret.
      - name: Sync admin password
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          if [ -z "$ADMIN_PASSWORD" ]; then
            echo "::notice::ADMIN_PASSWORD is not set, so /admin stays locked. Add it under Settings > Secrets and variables > Actions."
            exit 0
          fi
          printf '%s' "$ADMIN_PASSWORD" | npx wrangler secret put ADMIN_PASSWORD --env staging

      # Names only (never values) of the secrets already on the staging Worker, including any set by hand
      # in the Cloudflare dashboard; the steps below never replace those with nothing.
      - name: List staging Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler secret list --env staging > worker-secrets.json 2>/dev/null || echo '[]' > worker-secrets.json
          node -e 'const s=JSON.parse(require("fs").readFileSync("worker-secrets.json","utf8")); console.log("Worker secrets:", s.map(x=>x.name).sort().join(", ") || "(none)")'

      # Scrapwrk and /shipped sponsors share the store's Stripe settings. Staging prefers a test key
      # (STRIPE_TEST_SECRET_KEY); without one it uses the store's own STRIPE_SECRET_KEY, unless the Worker
      # already has a key set by hand. A live key on staging takes real payments: test with care.
      - name: Sync Stripe key
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          STRIPE_TEST_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_TEST_PUBLISHABLE_KEY: ${{ secrets.STRIPE_TEST_PUBLISHABLE_KEY }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
        run: |
          has() { node -e 'process.exit(JSON.parse(require("fs").readFileSync("worker-secrets.json","utf8")).some(x=>x.name===process.argv[1])?0:1)' "$1"; }
          if [ -n "$STRIPE_TEST_SECRET_KEY" ]; then
            key="$STRIPE_TEST_SECRET_KEY"; pk="$STRIPE_TEST_PUBLISHABLE_KEY"; mode=test
          elif has STRIPE_SECRET_KEY; then
            echo "::notice::Keeping the STRIPE_SECRET_KEY already set on the staging Worker."; exit 0
          elif [ -n "$STRIPE_SECRET_KEY" ]; then
            key="$STRIPE_SECRET_KEY"; pk="$STRIPE_PUBLISHABLE_KEY"; mode=live
          else
            echo "::notice::No Stripe key (STRIPE_TEST_SECRET_KEY or STRIPE_SECRET_KEY), so checkout on staging stays closed."; exit 0
          fi
          case "$key" in sk_test_*|rk_test_*) mode=test ;; sk_live_*|rk_live_*) mode=live ;; *) echo "::error::The Stripe key doesn't look like sk_test_/sk_live_."; exit 1 ;; esac
          [ "$mode" = live ] && echo "::warning::Staging is using the store's LIVE Stripe key: checkouts on staging charge real cards."
          printf '%s' "$key" | npx wrangler secret put STRIPE_SECRET_KEY --env staging
          if [ -n "$pk" ]; then printf '%s' "$pk" | npx wrangler secret put STRIPE_PUBLISHABLE_KEY --env staging; fi

      # /shipped "Shipped in <year>" receipts. Bryton's names come first (CLAUDE_KEY, TINYFISH), then the documented
      # ones. Without an Anthropic key receipts print as a demo; without Turnstile keys staging uses the test keys.
      - name: Sync /shipped secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ANTHROPIC_KEY: ${{ secrets.CLAUDE_KEY || secrets.ANTHROPIC_API_KEY }}
          TINYFISH_KEY: ${{ secrets.TINYFISH || secrets.TINYFISH_API_KEY }}
          SHIPPED_GITHUB_TOKEN: ${{ secrets.SHIPPED_GITHUB_TOKEN }}
          TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          SHIPPED_WEBHOOK: ${{ secrets.STRIPE_TEST_SHIPPED_WEBHOOK_SECRET || secrets.STRIPE_SHIPPED_WEBHOOK_SECRET }}
          PRODUCTHUNT_TOKEN: ${{ secrets.PRODUCTHUNT_TOKEN }}
        run: |
          sync() {
            if [ -z "$2" ]; then echo "::notice::$3 is not set, so $4."; return 0; fi
            printf '%s' "$2" | npx wrangler secret put "$1" --env staging
          }
          sync ANTHROPIC_API_KEY "$ANTHROPIC_KEY" "CLAUDE_KEY (repo secret)" "the Worker uses its own claude_key if set, else receipts print as a demo"
          sync TINYFISH_API_KEY "$TINYFISH_KEY" "TINYFISH (repo secret)" "the Worker uses its own tinyfish if set, else receipts skip TinyFish"
          sync GITHUB_TOKEN "$SHIPPED_GITHUB_TOKEN" SHIPPED_GITHUB_TOKEN "anonymous GitHub lookups share Cloudflare's IPs and a 60-an-hour limit"
          sync TURNSTILE_SITE_KEY "$TURNSTILE_SITE_KEY" TURNSTILE_SITE_KEY "staging uses Turnstile test keys"
          sync TURNSTILE_SECRET_KEY "$TURNSTILE_SECRET_KEY" TURNSTILE_SECRET_KEY "staging uses Turnstile test keys"
          sync STRIPE_SHIPPED_WEBHOOK_SECRET "$SHIPPED_WEBHOOK" STRIPE_TEST_SHIPPED_WEBHOOK_SECRET "(optional) refunds made in the Stripe dashboard don't remove /shipped lines"
          sync PRODUCTHUNT_TOKEN "$PRODUCTHUNT_TOKEN" PRODUCTHUNT_TOKEN "receipts skip Product Hunt"

      # Apple Pay needs the domain registered with Stripe (its verification file is public/.well-known).
      # Never fails the deploy: a wallet button that can't register simply doesn't show.
      - name: Register domain for Apple Pay
        env:
          STRIPE_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY || secrets.STRIPE_SECRET_KEY }}
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          [ -n "$STRIPE_KEY" ] || exit 0
          domain=$(printf '%s' "$DEPLOY_URL" | sed -E 's#^https?://##; s#/.*$##')
          curl -sS -u "$STRIPE_KEY:" https://api.stripe.com/v1/payment_method_domains -d "domain_name=$domain" | head -c 400 || true
          echo

      - name: Check every live song plays from staging
        env:
          CHECK_ORIGIN: ${{ steps.deploy.outputs.url }}
        run: npm run check:tracks

      - name: Comment staging link on the pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        env:
          STAGING_URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            const marker = '<!-- staging-deploy -->';
            const body = `${marker}\n**Staging is live:** ${process.env.STAGING_URL}\n\n` +
              `Built from \`${context.payload.pull_request.head.sha.slice(0, 7)}\`. ` +
              'Review it there; merging this pull request publishes it to https://brytonzoz.com.';
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
